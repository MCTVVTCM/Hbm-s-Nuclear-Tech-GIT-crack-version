name: CI

# 常规构建检查：推送到长期分支、PR、或手动触发。
# 打 v* 标签的发布流程在 release.yml 里。
on:
  push:
    branches:
      - master
      - portal-gun
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支连续推送时取消旧任务，省额度
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK 8)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # ForgeGradle 1.2 的反编译结果很大（~1.4GB），单独缓存，命中后构建从 20 分钟降到 3 分钟
      - name: Cache ForgeGradle workspace
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/minecraft
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: forge-1.7.10-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle') }}
          restore-keys: |
            forge-1.7.10-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava --no-daemon --stacktrace

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show artifacts
        run: ls -lh build/libs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: HBM-NTM-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
