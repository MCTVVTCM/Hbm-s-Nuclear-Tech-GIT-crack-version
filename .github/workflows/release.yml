name: Release

# 推送 v* 标签时自动构建并把 jar 附到 GitHub Release 上。
#   git tag -a v1.0.27-portal.1 -m "portal gun + threaded blast"
#   git push unorigin v1.0.27-portal.1
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: List artifacts
        run: ls -lh build/libs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # 标签名作为版本号；正文可以之后在网页上编辑
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
