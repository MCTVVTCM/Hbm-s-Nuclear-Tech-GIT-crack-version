import org.gradle.plugins.ide.eclipse.model.internal.FileReferenceFactory

import java.nio.file.Files
import java.nio.file.Paths
import java.nio.file.StandardCopyOption

buildscript {
	repositories {
		maven { url = 'https://maven.ntmr.dev/proxy/' }
		maven { url = 'https://maven.minecraftforge.net/' }
		maven { url = 'https://plugins.gradle.org/m2' }
		mavenCentral()
	}
	dependencies {
		// 原来这里是动态版本 1.2-1.0.+ + changing=true：每次构建都要联网校验，
		// 网络/代理抖动时会在配置阶段卡死。这里固定成本地缓存里的版本。
		classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.0.12'
	}
}

apply plugin: 'forge'
apply plugin: 'curseforge'
apply plugin: 'maven-publish'


if(Files.exists(Paths.get("curseforge.properties"))) {
	// Load CurseForge configuration
	ext.cfprops = parseConfig(file("curseforge.properties"))
}

if(Files.exists(Paths.get("maven.properties"))) {
	ext.mavenprops = parseConfig(file("maven.properties"))
}

def version_name = version = mod_version
if(!mod_build_number.isEmpty()) {
	version_name = mod_version + "_X" + mod_build_number
	version = "[${version_name}]"
}
group = "com.hbm" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "HBM-NTM"
compileJava.options.encoding = 'UTF-8'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
	version = "1.7.10-10.13.4.1614-1.7.10"
	runDir = "eclipse"
}

// A little hack to fix codechicken's crazy maven structure (at least in 1.7.10)
eclipse.classpath.file.whenMerged { cp ->
	// Find all codechicken source jars
	def srcent = cp.entries.findAll { entry -> entry.path.contains("codechicken") && entry.path.endsWith("-src.jar") }

	// Remove them from classpath
	cp.entries.removeAll srcent

	// Map the source entries to their dev counterparts based on basename
	Map<String, File> srcmap = new HashMap<String, File>()
	srcent.forEach { entry ->
		def file = new File(entry.path)
		srcmap.put(file.getName().replace("-src.jar", "-dev.jar"), file)
	}

	// Create file reference factory
	def fileref = new FileReferenceFactory()

	// Find all codechicken development jars
	cp.entries.findAll { entry -> entry.path.contains("codechicken") && entry.path.endsWith("-dev.jar") }.forEach { entry ->
		File srcmapping = new File(entry.path) // Initialize the srcmapping from the dev jar path
		srcmapping = srcmap.get(srcmapping.getName()) // Transform it using the sourcemap
		entry.sourcePath = fileref.fromFile(srcmapping) // Set the source path
	}
}

repositories {
	maven {
		name = 'Blerg'
		url = 'https://maven.ntmr.dev/proxy/'
	}
	maven {
		name = 'ModMaven'
		url = 'https://modmaven.dev'
	}
	maven {
		name = "gt"
		url = "https://gregtech.mechaenetia.com/"
	}
	//maven {
	//	name = "CurseForge"
	//	url = "https://minecraft.curseforge.com/api/maven/"
	//}
	maven {
		name = "Jitpack"
		url = "https://jitpack.io"
	}
	maven {
		name = "CurseMaven"
		url = "https://cursemaven.com"
	}
}

dependencies {
	implementation('codechicken:CodeChickenCore:1.7.10-1.0.4.29:dev') { transitive = false }
	compileOnly('codechicken:CodeChickenCore:1.7.10-1.0.4.29:src') { transitive = false }

	implementation('codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev') { transitive = false }
	compileOnly('codechicken:CodeChickenLib:1.7.10-1.1.3.140:src') { transitive = false }

	implementation('codechicken:NotEnoughItems:1.7.10-1.0.3.74:dev') { transitive = false }
	compileOnly('codechicken:NotEnoughItems:1.7.10-1.0.3.74:src') { transitive = false }

	compileOnly("inventorytweaks:InventoryTweaks:1.59-dev:deobf") { transitive = false }

	compileOnly("com.github.MightyPirates:OpenComputers:1.7.10-forge~1.8.9:api") { transitive = false }

	compileOnly("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta.56-GTNH:dev") { transitive = false }
}

processResources {
	// this will ensure that this task is redone when the versions change.
	inputs.property "version", project.version
	inputs.property "mcversion", project.minecraft.version

	// replace stuff in mcmod.info, nothing else
	from(sourceSets.main.resources.srcDirs) {
		include 'mcmod.info'

		// replace version and mcversion
		filesMatching('mcmod.info') {
			// replace version, mcversion and credits
			expand([
					version: version_name,
					credits: project.credits
			])
		}
	}

	// copy everything else, thats not the mcmod.info
	from(sourceSets.main.resources.srcDirs) {
		exclude 'mcmod.info'
	}
}

// add AT to meta-inf
jar {
    manifest {
        attributes 'FMLAT': 'HBM_at.cfg'
        // coremod：把区块包的 zlib 压缩级别从 6 降到 1（纯网络优化，见 ChunkPacketTransformer）
        attributes 'FMLCorePlugin': 'com.hbm.core.HbmCorePlugin'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}

task sourceJar(type: Jar) {
	from sourceSets.main.allJava

	classifier "src"

	manifest {
		attributes 'FMLAT': 'HBM_at.cfg'
	}
}

task devJar(type: Jar) {
	// hack: artificially depend on the reobf task here to get the normal jar to be overwritten before publishing
	dependsOn reobf

	from(sourceSets.main.output) {
		include "**"
	}
	classifier "dev"

	manifest {
		attributes 'FMLAT': 'HBM_at.cfg'
	}
}

task version {
	doFirst {
		println project.version
	}
}

if(Files.exists(Paths.get("curseforge.properties"))) {
	curse {
		apiKey = cfprops.api_key
		projectId = cfprops.project_id
		releaseType = "release"

		displayName = "Hbm's Nuclear Tech Mod " + version_name.replace("_", "") + " for Minecraft 1.7.10"

		gameVersions.addAll([
				"Forge",
				"Java 8",
				"Client", "Server"
		])

		if (Files.exists(Paths.get("changelog"))) {
			changelog = String.join("\r\n", Files.readAllLines(Paths.get("changelog")))

			// Perform a backup of the changelog and create a new file for next changes
			doLast {
				Files.move(Paths.get("changelog"), Paths.get("changelog.bak"), StandardCopyOption.REPLACE_EXISTING)
				Files.createFile(Paths.get("changelog"))
			}
		}
	}
}

if(Files.exists(Paths.get("maven.properties"))) {
	publishing {
		publications {
			release(MavenPublication) {
				artifactId archivesBaseName
				version version_name

				artifact sourceJar {
					classifier "src"
				}

				artifact devJar {
					classifier "dev"
				}

				artifact jar
			}
		}
		repositories {
			maven {
				name "Nuggies"
				url "https://maven.ntmr.dev/releases"

				credentials {
					username mavenprops.username
					password mavenprops.password
				}
				authentication {
					basic(BasicAuthentication)
				}
			}
		}
	}
}

// Properties file parsing helper
static def parseConfig(File config) {
	config.withReader {
		def prop = new Properties()
		prop.load(it)
		return (new ConfigSlurper().parse(prop))
	}
}

// ---------------------------------------------------------------------------
// 开发运行任务：默认用 TravaJDK 8 DCEVM 启动，便于 IDEA 热替换（增删方法/字段）
//
//   ./gradlew runClient --offline                     # 普通启动
//   ./gradlew runClient --offline -PdebugPort=5005    # 额外开 JDWP，IDEA: Run > Attach to Process
//   ./gradlew runClient --offline -Pxmx=6G            # 加大堆
//
// 以前这些只写在 devtools/hotreload.gradle（init script）里，必须带 -I 才生效；
// 现在直接写进 build.gradle，任何方式的 runClient 都走同一套配置。
// ---------------------------------------------------------------------------
def dcevmJavaPath = project.findProperty('dcevmJava') ?:
        System.getenv('DCEVM_JAVA') ?: "${System.getProperty('user.home')}/.jdks/trava-jdk-8-dcevm-8u282/bin/java"

['runClient', 'runServer'].each { taskName ->
    def exec = tasks.findByName(taskName)
    if(exec == null) return

    boolean useDcevm = new File(dcevmJavaPath).canExecute()

    if(useDcevm) {
        exec.executable = dcevmJavaPath
        logger.lifecycle("[hotreload] ${taskName}: JVM = ${dcevmJavaPath} (DCEVM)")
    } else {
        logger.lifecycle("[hotreload] ${taskName}: 未找到 DCEVM，用默认 JVM（只能改方法体）")
    }

    exec.jvmArgs '-Dfile.encoding=UTF-8',
                 '-Dfml.ignoreInvalidMinecraftCertificates=true',
                 '-Dfml.ignorePatchDiscrepancies=true',
                 '-Dorg.lwjgl.util.NoChecks=true',
                 // 开发环境不走 jar 的 MANIFEST，必须显式声明 coremod 才会被加载
                 '-Dfml.coreMods.load=com.hbm.core.HbmCorePlugin',
                 // 本地单人：区块包完全不压缩（配合 eclipse/server.properties 里的
                 // network-compression-threshold=-1）。联机服务器不要带这个参数。
                 '-Dhbm.chunk.deflate=0'

    // 把 -Phbm.prof.tag=... / -Phbm.bench.auto=... 转发成游戏进程的 -D，供测试/统计代码读取
    ['hbm.prof.tag', 'hbm.bench.auto', 'hbm.bench.offset', 'hbm.bench.delay', 'hbm.bench.world', 'hbm.bench.cmd', 'hbm.chunk.async', 'hbm.light.budget'].each { key ->
        def value = project.findProperty(key)
        if(value != null) {
            exec.jvmArgs "-D${key}=${value}"
            logger.lifecycle("[bench] ${taskName}: -D${key}=${value}")
        }
    }

    if(project.hasProperty('debugPort')) {
        exec.jvmArgs "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=${project.property('debugPort')}"
        logger.lifecycle("[hotreload] ${taskName}: JDWP 127.0.0.1:${project.property('debugPort')}")
    }

    // ---- GC 调参 ----
    // 1.7.10 + 大堆默认的 ParallelGC 会出现秒级 full GC 停顿（"飞着飞着定住 1~3 秒"）。
    // 但 DCEVM 只支持 Serial / CMS，传 G1 会直接启动失败（Must use the serial or CMS GC in the DCEVM）。
    // 所以按 JVM 分开配：DCEVM 用 CMS，普通 JDK 用 G1。
    if(useDcevm) {
        exec.jvmArgs '-XX:+UseConcMarkSweepGC',
                     '-XX:+CMSParallelRemarkEnabled',
                     '-XX:+UseCMSInitiatingOccupancyOnly',
                     '-XX:CMSInitiatingOccupancyFraction=50',
                     '-XX:+ExplicitGCInvokesConcurrent',
                     '-XX:+ParallelRefProcEnabled',
                     // 新生代固定 1.5G：区块加载会产生大量朝生夕死的对象，
                     // 默认新生代太小会导致 10 秒 5 次 GC、每次 160ms（实测）。
                     '-Xmn2048M',
                     '-XX:SurvivorRatio=8',
                     '-Xms3G',
                     // 记录真实 STW 停顿：CMS 的 CollectionTime 含并发阶段，不能当停顿看
                     '-XX:+PrintGCApplicationStoppedTime',
                     '-XX:+PrintGCDateStamps',
                     '-Xloggc:gc.log'
        logger.lifecycle("[hotreload] ${taskName}: GC = CMS (DCEVM 只支持 Serial/CMS)")
    } else {
        exec.jvmArgs '-XX:+UseG1GC',
                     '-XX:MaxGCPauseMillis=40',
                     '-XX:+ParallelRefProcEnabled',
                     '-XX:G1HeapRegionSize=8M',
                     '-Xmn1536M',
                     '-Xms2G'
        logger.lifecycle("[hotreload] ${taskName}: GC = G1 (MaxGCPauseMillis=40)")
    }

    if(project.hasProperty('xmx')) {
        exec.maxHeapSize = project.property('xmx').toString()
        logger.lifecycle("[hotreload] ${taskName}: 堆 = ${exec.maxHeapSize}")
    } else {
        exec.maxHeapSize = '6G'
    }
}
